services:
  postgres:
    image: postgres:16-alpine
    container_name: math-learning-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  # Servicios del proyecto de aprendizaje de matemáticas
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: math-learning-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${BACKEND_PORT}
    expose:
      - ${BACKEND_PORT}
    # volumes:
    #   - videos_volume:/app/dist/public/videos  # REMOVIDO: los videos ya están en la imagen Docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy-network

  # Servicio frontend del proyecto de aprendizaje de matemáticas
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: math-learning-frontend
    environment:
      - API_URL=${FRONTEND_API_URL}
    expose:
      - 3000
    depends_on:
      - backend
    networks:
      - proxy-network

volumes:
  postgres_data:
networks:
  proxy-network:
    driver: bridge
