services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - unal-network
  # Servicios del proyecto de aprendizaje de matemáticas
  math-learning-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${BACKEND_PORT}
    expose:
      - ${BACKEND_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unal-network

  # Servicio frontend del proyecto de aprendizaje de matemáticas
  math-learning-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - API_URL=${FRONTEND_API_URL}
    expose:
      - 3000
    depends_on:
      - math-learning-backend
    networks:
      - unal-network

volumes:
  postgres_data:
networks:
  unal-network:
    driver: bridge
